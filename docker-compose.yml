# Local stack. `npm run db:up` starts only Postgres for `npm run dev`;
# `docker compose up --build` runs the whole thing the way production does.
services:
  db:
    image: postgres:16-alpine
    container_name: 'dietyaar-db'
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # Isolated, disposable integration database. It is opt-in so normal local
  # development cannot accidentally run database tests against `app`.
  db-test:
    image: postgres:16-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dietyaar_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dietyaar_test']
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    image: dietyaar-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 'dietyaar-web'
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/app?schema=public
    depends_on:
      db:
        condition: service_healthy

  # Explicit one-off migration job. Run with:
  #   docker compose --profile ops run --rm migrate
  # Web replicas never apply schema changes during startup.
  migrate:
    image: dietyaar-local:latest
    profiles: ['ops']
    command: ['./docker-migrate.sh']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/app?schema=public
    depends_on:
      db:
        condition: service_healthy

  # Optional enhanced-mode worker from the same immutable image. Core mode
  # does not start this profile and never depends on it.
  worker:
    image: dietyaar-local:latest
    profiles: ['enhanced']
    command: ['./docker-worker.sh']
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      WORKER_ENABLED: 'true'
      AI_PLAN_IMAGE_ENABLED: 'false'
      AI_MEAL_PHOTO_ENABLED: 'false'
      AI_REFLECTION_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
