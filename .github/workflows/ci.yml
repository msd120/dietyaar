name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://build:build@localhost:5432/build
  # Synthetic build-only value. Production deployments must provide their own secret.
  BETTER_AUTH_SECRET: ci-only-build-secret-not-for-production

jobs:
  quality:
    name: Lint, typecheck, tests, and build
    runs-on: ubuntu-latest
    env:
      # Prisma loads prisma.config.ts even for client generation. This URL is
      # syntactically valid but generate/build never connect to it.
      DIRECT_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:all
      - run: npm run test:coverage
      - run: npm run build

  database-integration:
    name: Fresh migration and PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dietyaar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dietyaar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dietyaar_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: Foundation end-to-end
    runs-on: ubuntu-latest
    needs: [quality, database-integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      # Prisma migrations intentionally use the direct connection to this
      # job's isolated PostgreSQL service, never the build-only placeholder.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run db:deploy
      - run: npm run demo:seed
      - run: npm run build
      - run: npm run test:e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dietyaar:ci
          build-args: |
            BETTER_AUTH_SECRET=${{ env.BETTER_AUTH_SECRET }}
